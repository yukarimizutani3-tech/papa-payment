<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>パパへのお願い帳 🎀</title>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getDatabase, ref, onValue, set, get } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAlQevbPgkEZbojroygIY5LGB-LBBMKI3Y",
    authDomain: "papa-b24de.firebaseapp.com",
    databaseURL: "https://papa-b24de-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "papa-b24de",
    storageBucket: "papa-b24de.firebasestorage.app",
    messagingSenderId: "464345106150",
    appId: "1:464345106150:web:99e8be268b2e2ee12c1d27"
  };

  const app = initializeApp(firebaseConfig);
  const db  = getDatabase(app);
  const dbRef = ref(db, "items");

  const PASTEL = ["#FFB7C5","#FFCBA4","#FFF3A3","#B5EAD7","#C7CEEA","#E2B4E6","#FFD1DC"];
  const CATS   = ["🏫 学校","👗 服","📚 本・文具","💄 美容","🎮 趣味","🍽️ 食事","🚌 交通費","💊 医療","✨ その他"];

  let items = [];
  let role  = sessionStorage.getItem("papa-role") || null;
  let knownPaid = new Set();
  let firstLoad = true;

  // ── Firebase リアルタイム同期 ──────────────────────────────
  onValue(dbRef, (snapshot) => {
    const data = snapshot.val();
    items = data ? Object.values(data) : [];

    if (firstLoad) {
      items.filter(i=>i.paid).forEach(i=>knownPaid.add(i.id));
      firstLoad = false;
    } else if (role === "child") {
      items.filter(i=>i.paid).forEach(i=>{
        if (!knownPaid.has(i.id)) {
          knownPaid.add(i.id);
          showToast(`🎉 パパが「${i.name}」を払ってくれたよ！`);
          showConfetti();
        }
      });
    }
    render();
